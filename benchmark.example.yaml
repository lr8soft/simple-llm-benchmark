version: 1

model:
  provider: benchmark
  model_id: your-model-id
  base_url: https://api.example.com/v1
  api_key: your-api-key
  tls:
    # false 会完全关闭 HTTPS 证书校验，仅用于可信内网/自签名测试环境。
    verify: true

run:
  suite: quick-v1
  output_dir: runs
  # 较慢或经过 Cloudflare 的自建网关建议从 2 开始，稳定后再提高。
  max_connections: 2
  max_retries: 3
  timeout: 120
  temperature: 0
  seed: 42

suites:
  quick-v1:
    benchmarks:
      - id: mmlu_pro
        label: MMLU-Pro
        dimension: Knowledge & reasoning
        task: inspect_evals/mmlu_pro
        samples: 500
        epochs: 1
        max_tokens: 2048
        weight: 0.20
        task_args:
          fewshot: 0
          shuffle: true
        metric_names: [accuracy]

      - id: gpqa_diamond
        label: GPQA Diamond
        dimension: Science reasoning
        task: inspect_evals/gpqa_diamond
        samples: 198
        epochs: 1
        max_tokens: 2048
        weight: 0.10
        task_args:
          cot: true
        metric_names: [accuracy]

      - id: gsm8k
        label: GSM8K
        dimension: Mathematics
        task: inspect_evals/gsm8k
        samples: 500
        epochs: 1
        max_tokens: 2048
        weight: 0.20
        task_args:
          fewshot: 0
        metric_names: [accuracy]

      - id: ifeval
        label: IFEval
        dimension: Instruction following
        task: inspect_evals/ifeval
        samples: 541
        epochs: 1
        max_tokens: 2048
        weight: 0.20
        metric_names: [if_metric.prompt_strict_acc]

      - id: humaneval
        label: HumanEval
        dimension: Code
        task: inspect_evals/humaneval
        samples: 164
        epochs: 1
        max_tokens: 2048
        weight: 0.15
        metric_names: [accuracy]

      - id: mmmlu_zh
        label: MMMLU-ZH
        dimension: Chinese knowledge
        task: inspect_evals/mmlu_0_shot
        samples: 500
        epochs: 1
        max_tokens: 2048
        weight: 0.15
        task_args:
          language: ZH_CN
          cot: true
          shuffle: true
        metric_names: [accuracy]
